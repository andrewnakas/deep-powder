[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-powder"
version = "0.1.0"
description = "Research entry in PowderBench: a two-level stack (LightGBM quantiles, hurdle classifiers, neural net, per-league blend) on ensemble and multi-model features."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "typer>=0.12",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.23",
    "xarray>=2024.6",
    "zarr>=3",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "timezonefinder>=6.5",
    "scipy>=1.11",
    "icechunk>=1.0",
    "eccodes>=2.38",  # NBM GRIB2 (nbmx.py); the wheel bundles the ecCodes library
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
terrain = ["rasterio>=1.3"]
nn = ["torch>=2.2"]

[project.scripts]
dpow = "dpow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dpow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B023", "B905"]
