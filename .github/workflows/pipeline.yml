# The model pipeline: build the training table from the sibling entries'
# stores, run every level-1 learner out of fold (one job each, in parallel),
# then fit and report the level-2 stacker. Each stage publishes to a release
# (`table`, `oof`), so a stage can be rerun alone.
name: Pipeline

on:
  schedule:
    - cron: "40 5 * * *"  # daily, after the sibling entries' harvests
  workflow_dispatch:
    inputs:
      stage:
        description: "all, table, oof or stack"
        default: all
      learners:
        description: "JSON list of level-1 learners"
        default: '["q50", "qlo", "qhi", "hurdle", "tweedie", "nn"]'
      bundle:
        description: "Bundle"
        default: nh

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  BUNDLE: ${{ inputs.bundle || 'nh' }}

jobs:
  table:
    if: contains(fromJSON('["all", "table"]'), inputs.stage || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Hourly-GFS features for the newest rounds
        run: for lg in stations observers alps; do dpow nbhd --league "$lg" --minutes 20 || echo "::warning::nbhd $lg failed"; dpow nbhd --league "$lg" --minutes 20 --source wind || echo "::warning::wndx $lg failed"; done
      - name: GFS at every station (dynamical.org) for the newest rounds
        if: env.BUNDLE == 'nh'
        run: dpow dynom-update --minutes 40 || echo "::warning::dynom update failed"
      - run: dpow table --bundle "$BUNDLE"

  oof:
    needs: table
    if: always() && !cancelled() && needs.table.result != 'failure' && contains(fromJSON('["all", "oof"]'), inputs.stage || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        learner: ${{ fromJSON(inputs.learners || '["q50", "qlo", "qhi", "hurdle", "tweedie", "nn"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dpow oof --bundle "$BUNDLE" --learner "${{ matrix.learner }}"

  stack:
    needs: oof
    if: always() && !cancelled() && contains(fromJSON('["all", "oof", "stack"]'), inputs.stage || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dpow stack --bundle "$BUNDLE"
