# The model pipeline: build the training table from the sibling entries'
# stores, run every level-1 learner out of fold (one job each, in parallel),
# then fit and report the level-2 stacker. Each stage publishes to a release
# (`table`, `oof`), so a stage can be rerun alone.
name: Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all, table, oof or stack"
        default: all
      learners:
        description: "JSON list of level-1 learners"
        default: '["q50", "qlo", "qhi", "hurdle", "tweedie", "nn"]'
      bundle:
        description: "Bundle"
        default: nh

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}
  BUNDLE: ${{ inputs.bundle || 'nh' }}

jobs:
  table:
    if: contains(fromJSON('["all", "table"]'), inputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dpow table --bundle "$BUNDLE"

  oof:
    needs: table
    if: always() && !cancelled() && needs.table.result != 'failure' && contains(fromJSON('["all", "oof"]'), inputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        learner: ${{ fromJSON(inputs.learners) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: PyTorch (CPU build) for the neural net
        if: matrix.learner == 'nn'
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - run: dpow oof --bundle "$BUNDLE" --learner "${{ matrix.learner }}"

  stack:
    needs: oof
    if: always() && !cancelled() && contains(fromJSON('["all", "oof", "stack"]'), inputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dpow stack --bundle "$BUNDLE"
